<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a3a2a">
<meta name="robots" content="noindex">
<title>Pay fees</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:radial-gradient(120% 80% at 100% 0%,#1f8a62,#0a3a2a 55%,#061f16);color:#132119;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:26px;width:100%;max-width:380px;padding:24px 22px 20px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.ac{font-weight:800;font-size:19px;letter-spacing:-.01em}
.for{color:#6f7d74;font-size:14px;margin-top:3px;font-weight:500}
.amt{font-size:40px;font-weight:800;margin:14px 0 2px;color:#0f5a3f;letter-spacing:-.02em}
.qr{margin:14px auto 6px;width:236px;height:236px;padding:12px;border-radius:20px;border:2px solid #e8c172;background:#fff}
.qr canvas,.qr img{width:100%;height:100%;image-rendering:pixelated}
.vpa{font-size:14px;color:#3a4a40;font-weight:700;margin:8px 0 16px;word-break:break-all}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer;margin-top:10px}
.pay{background:linear-gradient(180deg,#17805a,#0f6a4a);color:#fff;box-shadow:0 6px 16px rgba(15,90,63,.35)}
.ghost{background:#f1f4f0;color:#132119}
.apps{font-size:12.5px;color:#6f7d74;margin-top:8px}
.note{font-size:13px;color:#3a4a40;background:#fff8e8;border-radius:12px;padding:10px 12px;margin-top:16px;line-height:1.45}
.err{color:#c8372d;font-weight:700}
</style>
</head>
<body>
<div class="card" id="c"></div>
<script src="qrcode.js"></script>
<script>
const q=new URLSearchParams(location.search);
const pa=(q.get('pa')||'').trim(),pn=(q.get('pn')||'Academy').trim(),am=parseFloat(q.get('am')||'0')||0,tn=(q.get('tn')||'Fees').trim(),st=(q.get('st')||'').trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c=document.getElementById('c');
if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(pa)){
  c.innerHTML='<div class="ac">Payment link</div><p class="err">This payment link is incomplete. Please ask the academy for their UPI ID.</p>';
}else{
  const upi='upi://pay?'+['pa='+encodeURIComponent(pa),'pn='+encodeURIComponent(pn),am>0?'am='+am.toFixed(2):'','cu=INR','tn='+encodeURIComponent(tn)].filter(Boolean).join('&');
  document.title='Pay '+pn;
  c.innerHTML=`<div class="ac">${esc(pn)}</div><div class="for">${st?'Fees for <b>'+esc(st)+'</b>':esc(tn)}</div>
   ${am>0?`<div class="amt">₹${Math.round(am).toLocaleString('en-IN')}</div>`:''}
   <div class="qr" id="qr"></div>
   <div class="vpa">UPI ID: ${esc(pa)}</div>
   <a class="btn pay" href="${esc(upi)}">Pay now with UPI app</a>
   <div class="apps">Opens Google Pay, PhonePe, Paytm or BHIM with the amount filled in</div>
   <button class="btn ghost" id="copy">Copy UPI ID</button>
   <div class="note">📸 Scan the QR from another phone, or tap <b>Pay now</b>.<br>After paying, please send the screenshot on WhatsApp. 🙏</div>`;
  try{const qr=qrcode(0,'M');qr.addData(upi);qr.make();document.getElementById('qr').innerHTML=qr.createSvgTag({cellSize:6,margin:0,scalable:true})}catch(e){document.getElementById('qr').textContent='QR not available'}
  document.getElementById('copy').onclick=async e=>{try{await navigator.clipboard.writeText(pa);e.target.textContent='Copied ✓'}catch(x){e.target.textContent=pa}};
}
</script>
</body>
</html>
